<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suporte Técnico</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="box">
<h1>🛠️ Suporte Técnico</h1><p>Login do sistema</p>
<input id="usuario" placeholder="Usuário"><input id="senha" type="password" placeholder="Senha">
<button onclick="entrar()">Entrar</button>
<small>Funcionário: funcionario / 1234<br>Técnico: tecnico / 1234</small>
</div>

<div id="sistema" class="hidden">
<header><h2>🛠️ Sistema de Chamados</h2><button onclick="sair()">Sair</button></header>
<main>
<section id="areaFuncionario" class="box hidden">
<h2>Abrir chamado</h2><p>Por favor, detalhe o seu chamado.</p>
<select id="categoria"><option value="">Categoria</option><option>Hardware</option><option>Software</option><option>Rede/Internet</option><option>Acesso</option><option>Outros</option></select>
<select id="prioridade"><option value="">Prioridade</option><option>Baixa</option><option>Média</option><option>Alta</option></select>
<input id="titulo" placeholder="Título do problema">
<textarea id="descricao" placeholder="Descrição do problema"></textarea>
<button onclick="criarChamado()">Abrir chamado</button>
</section>

<section id="areaTecnico" class="box hidden">
<h2>Chamados</h2><p>Área exclusiva do técnico.</p><div id="lista"></div>
</section>
</main></div>
<script src="script.js"></script>
</body></html>
